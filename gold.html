<style>
  /* The Gold tab (owner 26/11/2026). Charts only: the CME micro gold future (MGC, the contract the board follows) and

  :root {

    --fut: #e8eef6; --hl: #e3a72f; --ma: #5b8cff; --ema: #c084fc;
    --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;

  /* ---- the page: one strategy line, then the charts; the prices read inside each chart's corner ---- */

  #loading { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); color: var(--muted); }

<script>
'use strict';
const MIN = 60000, HOUR = 3600000, DAY = 86400000, FILL = 15 * MIN;  // a price is carried over quiet minutes for at most 15 minutes
const { candleRows, toBar } = NdxEngine.internals;
const HL_COIN = 'xyz:GOLD', FUT = 'MGC';
const TGT = 2.5, STOP = 19.3, EXIT_AFTER = 14 * HOUR + 10 * MIN, HL_MONDAY_FROM = '2026-11-30';  // the live gold trade: target, stop, out 08:10 New York; Mondays on Hyperliquid's side from 30 Nov
const $ = id => document.getElementById(id);
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };
let TZ = store('nsb.gold.tz') === 'ist' ? 'ist' : 'et';  // the clock: New York (CME's) or India
let MATCH = store('nsb.gold.match') === '1';              // Hyperliquid's line moved onto the futures at each close
let STRAT = store('nsb.gold.strat') !== '0';              // the strategy's 50-day line and trade
const EMAS = [200];                                        // the EMA on the futures, in 1-minute bars (0 = off); owner 27/11: the 200 only
let EMA = (() => { const v = store('nsb.gold.ema'); return v === '0' ? 0 : 200; })();
let DAYK = null, LIVE = true, PERPS_DAYS = new Set(), FUT_DAYS = new Set(), GOLD_DAYS = new Set(), BRD_ROLLS = [], ROLLS = [], DAILY = null, BY = new Map();

// ---- clocks and numbers ----------------------------------------------------------------------------------------
const ZONE = { et: 'America/New_York', ist: 'Asia/Kolkata' }, ZN = { et: 'ET', ist: 'IST' };
const fmtCache = new Map();
const fmt = (ms, z, o) => { const k = z + JSON.stringify(o); if (!fmtCache.has(k)) fmtCache.set(k, new Intl.DateTimeFormat('en-GB', { timeZone: ZONE[z], ...o })); return fmtCache.get(k).format(new Date(ms)); };
const hm = (ms, z = TZ) => fmt(ms, z, { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const dwhm = (ms, z = TZ) => `${fmt(ms, z, { weekday: 'short', day: 'numeric', month: 'short' })} ${hm(ms, z)} ${ZN[z]}`;
const both = ms => `${dwhm(ms, 'et')} · ${dwhm(ms, 'ist')}`;
const p1 = v => v == null || !isFinite(v) ? '—' : v.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const sg = v => v == null || !isFinite(v) ? '—' : (v > 0.05 ? '+' : v < -0.05 ? '−' : '±') + Math.abs(v).toFixed(1);
const cls = v => v == null ? '' : v > 0.05 ? 'up' : v < -0.05 ? 'down' : '';
const MON3 = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WK3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const contractName = n => { const m = /(\d\d)-(\d\d)/.exec(n || ''); return m ? `${MON3[+m[1] - 1]} 20${m[2]}` : (n || ''); };
const dayName = k => { const d = new Date(k + 'T00:00:00Z'); return `${WK3[d.getUTCDay()]} ${d.getUTCDate()} ${MON3[d.getUTCMonth()]}`; };
const sideTxt = s => s > 0 ? 'LONG' : 'SHORT', sidePill = s => `<span class="pill ${s > 0 ? 'long' : 'short'}">${sideTxt(s)}</span>`;

// ---- the CME trading day (cme.js): day k runs 18:00 New York the evening before to 17:00 on k ---------------------
const isWd = k => { const w = new Date(k + 'T00:00:00Z').getUTCDay(); return w >= 1 && w <= 5; };
const prevWd = k => { let p = NsbCme.prev(k); while (!isWd(p)) p = NsbCme.prev(p); return p; };
const nextWd = k => { let p = NsbCme.next(k); while (!isWd(p)) p = NsbCme.next(p); return p; };
const openOf = k => NsbCme.open(k), endOf = k => NsbCme.open(k) + 23 * HOUR;
// the day to follow live: from the futures' 17:00 close it is already the next one (its break; at weekends the Monday)
const curKey = () => { const now = Date.now(); let k = NsbCme.key(now); if (isWd(k) && now >= endOf(k)) k = NsbCme.next(k); while (!isWd(k)) k = NsbCme.next(k); return k; };
const utcKey = t => new Date(t).toISOString().slice(0, 10);
// the chart's clock: Lightweight Charts lays its ticks out in UTC, so each time is moved by its zone's offset (New York's
// changes with summer time; an hour repeated when the clocks go back keeps its first copy)
const offCache = new Map();
function offsetOf(t, z = TZ) {
  const hk = z + Math.floor(t / HOUR);
  if (!offCache.has(hk)) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: ZONE[z], hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
      .formatToParts(new Date(Math.floor(t / HOUR) * HOUR)).map(x => [x.type, x.value]));
    offCache.set(hk, Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour % 24, +p.minute) - Math.floor(t / HOUR) * HOUR);
  }
  return offCache.get(hk);
}
const toChart = t => (t + offsetOf(t)) / 1000;  // real ms -> the chart's seconds (local clock written as UTC)
const pad = n => String(n).padStart(2, '0');
const utcDays = (a, b) => { const out = []; for (let t = Math.floor(a / DAY) * DAY; t <= b; t += DAY) out.push(utcKey(t)); return out; };
const shuts = (a, b) => {  // [from, to) the futures are shut by the schedule, touching [a, b]: each day's 17:00-18:00 and the weekend
  const out = []; let k = prevWd(NsbCme.key(a)); k = prevWd(k);
  for (let i = 0; i < 40; i++) { const s = endOf(k), n = nextWd(k), e = openOf(n); if (s > b) break; if (e > a) out.push([s, e]); k = n; }
  return out;
};

// ---- data ---------------------------------------------------------------------------------------------------------
// Hyperliquid: our 1-minute archive (from 18 Oct 2026), before it the older days' file (Hyperliquid's own 15-minute /
// 30-minute / hourly candles), else Hyperliquid's own last ~3.5 days. Futures: the VPS's saved days and its stream,
// before 15 Oct 2026 the older days' file (the lab's ticks). A day not over yet is kept a minute; a request under way is shared.
const hlCache = new Map(), futCache = new Map(), goldCache = new Map();
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function getJson(url) { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(`${url}: ${r.status}`); return r.json(); }
async function readIndexes() {  // -> true when a new saved day appeared
  const [p, f, r, g, dl] = await Promise.all([getJson('data/perps/1m/index.json').catch(() => null), getJson('data/futures/1m/index.json').catch(() => null), getJson('data/futures/1m/rolls.json').catch(() => null),
    GOLD_DAYS.size ? null : getJson('data/gold/1m/index.json').catch(() => null), DAILY ? null : getJson('data/gold/daily.json').catch(() => null)]);
  const before = PERPS_DAYS.size + FUT_DAYS.size;
  if (p) PERPS_DAYS = new Set((p.dates || []).map(String));
  if (f) FUT_DAYS = new Set((Array.isArray(f) ? f : f.dates || []).map(String));
  if (g) GOLD_DAYS = new Set((g.dates || []).map(String));
  if (dl) DAILY = dl;
  if (r) BRD_ROLLS = (r.rolls && r.rolls[FUT]) || [];
  // the contract switches: the board's, and before it the older days' (found where the futures jumped at a weekday reopen)
  const seen = new Set(BRD_ROLLS.map(x => x.t));
  ROLLS = [...BRD_ROLLS, ...((DAILY && DAILY.rolls) || []).filter(x => !seen.has(x.t) && x.how !== 'board rolls.json')].sort((a, b) => a.t - b.t);
  return PERPS_DAYS.size + FUT_DAYS.size !== before;
}
function cached(cache, key, fetcher) {
  const c = cache.get(key), now = Date.now();
  if (c && c.val !== undefined && (c.done || now - c.at < MIN)) return Promise.resolve(c.val);
  if (c && c.p) return c.p;
  const p = fetcher(c && c.val).then(([val, done]) => { cache.set(key, { val, done, at: Date.now() }); return val; });
  cache.set(key, { ...(c || {}), p });
  return p;
}
const goldFile = key => {  // one older day: { f: futures 1-minute, h: Hyperliquid bars, hr: minutes a Hyperliquid bar }
  if (!GOLD_DAYS.has(key)) return Promise.resolve(null);
  if (!goldCache.has(key)) goldCache.set(key, getJson(`data/gold/1m/${key}.json`).catch(() => { goldCache.delete(key); return null; }));
  return goldCache.get(key);
};
const hlDay = key => cached(hlCache, key, async prev => {  // -> [{t, o, h, l, c, r}] of one UTC day (r: minutes a bar)
  const d0 = Date.parse(key + 'T00:00:00Z'), now = Date.now(), over = now > d0 + DAY + MIN;

  const hlSide = R && R.h1745 != null && R.closeH17 != null && R.h1745 !== R.closeH17 ? (R.h1745 > R.closeH17 ? 1 : -1) : null;
  const wkS = mon && DAILY && DAILY.wk && DAILY.wk[k] ? DAILY.wk[k][0] : null;
  const side = mon && (hlSide || wkS) ? (hlSide || wkS) : D.tonl ? D.tonl.side : null;
  D.trade = side ? tradeOf(D, k, side) : null;
  draw(D, keepView); if (hoverT == null || !keepView) readout(null); stratBar(D); drawDaily(S); if (!$('lgDay').innerHTML) $('lgDay').innerHTML = DAY_KEY();
  days = dayList(); const pk = days.join() + '|' + k; if (pk !== pickedKey) { pick.set(days, k, curKey()); pickedKey = pk; }
  controls();
  const hlN = D.rows.filter(r => r.hBar).length, fN = D.rows.filter(r => r.fBar).length;
  const w = [];
  if (!hlN) w.push(D.a > Date.parse('2026-04-30') ? 'No Hyperliquid minutes saved for this stretch.' : 'No Hyperliquid prices for this day (Hyperliquid gold history starts 29 Apr 2026).');
  else if (D.hres > 1) w.push(`Older day: Hyperliquid here is ${D.hres === 60 ? 'hourly' : D.hres + '-minute'} bars (1-minute from 18 Oct 2026), so its line moves in steps.`);
  for (const r of ROLLS.filter(r => r.t * 1000 >= D.a && r.t * 1000 <= D.b)) w.push(`Contract switch at ${dwhm(r.t * 1000)} (${sg(r.gap)} pts): the later contract trades above spot, so the futures line sits about that much higher from then on.`);
  for (const x of D.shuts.filter(x => x.early)) w.push(`The futures stopped at ${dwhm(x.s)}, before the usual 17:00 close (holiday or no data).`);
  if (STRAT && D.trade && D.trade.test && D.trade.test[0] !== D.trade.side && !(new Date(k + 'T00:00:00Z').getUTCDay() === 1 && k >= HL_MONDAY_FROM)) w.push(`The test took ${sideTxt(D.trade.test[0])} this day (its closes differ slightly), so its result is not shown.`);
  $('warn').textContent = w.join(' ');
  $('loading').hidden = true;
}

// ---- live: Hyperliquid's candle stream and the VPS stream; redrawn at most once a second while the newest day is shown --
const liveHl = new Map();
let hlWs = null, hlLast = 0, hlDownAt = 0, redrawT = 0;
function hlConnect() {
  const ws = hlWs = new WebSocket('wss://api.hyperliquid.xyz/ws');
  ws.onopen = () => { hlDownAt = 0; ws.send(JSON.stringify({ method: 'subscribe', subscription: { type: 'candle', coin: HL_COIN, interval: '1m' } })); };
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } hlLast = Date.now(); if (m.channel === 'candle' && m.data && m.data.s === HL_COIN) { const b = toBar(m.data); liveHl.set(b.t, { t: b.t, o: b.o, h: b.h, l: b.l, c: b.c, r: 1 }); tick(); } };
  ws.onclose = () => { if (hlWs !== ws) return; if (!hlDownAt) hlDownAt = Date.now(); setTimeout(hlConnect, 3000); };
  ws.onerror = () => ws.close();
}
setInterval(() => { if (hlWs && hlWs.readyState === WebSocket.OPEN) hlWs.send('{"method":"ping"}'); }, 30000);
setInterval(() => { const cut = Date.now() - 2 * DAY; for (const t of liveHl.keys()) if (t < cut) liveHl.delete(t); }, 10 * MIN);
// redraw while the newest day is shown live: once a second at most; at the futures' close the next trading day takes over
// (any=true: a slow Hyperliquid answer arrived, redraw whatever day is shown)
function redraw(any = false) {
  if ((!LIVE && !any) || redrawT) return;
  redrawT = setTimeout(() => { redrawT = 0; const k = LIVE ? curKey() : DAYK; show(k, k === DAYK); }, 300);  // (prices between rebuilds: tick() / fast())
}
NsbLive.on((kind, s) => { if (kind === 'snapshot') redraw(); else if (s === FUT) tick(); });
// The fast path (owner 27/11: "the price to be updated like real time"): a new futures or Hyperliquid price moves the
// newest minute's point on each line, the gap, the EMA and the corner reading straight away (at most 10 times a second);
// a price for a minute the chart does not have yet (a new minute) rebuilds the whole chart, as does a slow check every 15 s.
let tickT = 0;
function tick() { if (!tickT) tickT = setTimeout(() => { tickT = 0; fast(); }, 100); }
function fast() {
  const D = built; if (!LIVE || !D || D.k !== DAYK || DAYK !== curKey()) return;
  const fb = NsbLive.bars(FUT), fl = fb.length ? fb[fb.length - 1] : null;
  let hl = null; for (const x of liveHl.values()) if (!hl || x.t > hl.t) hl = x;
  const last = D.rows[D.rows.length - 1];
  if (!last || (fl && fl.t > last.t) || (hl && hl.t > last.t)) { redraw(); return; }  // a new minute: rebuild
  const r = last, x = toChart(r.x);
  if (fl && fl.t === r.t && !r.shut) { r.fBar = { t: fl.t, o: fl.o, h: fl.h, l: fl.l, c: fl.c }; r.f = fl.c; }
  if (hl && hl.t === r.t) { r.hBar = hl; r.h = hl.c; }
  const hv = r.h == null ? null : MATCH ? (r.basis == null ? null : r.h - r.basis) : r.h, ref = r.shut ? r.closeF : r.f;
  try {
    if (!r.shut && r.f != null) sFut.update({ time: x, value: r.f });
    if (hv != null) sHl.update({ time: x, value: hv });
    if (hv != null && ref != null) sDiff.update({ time: x, value: +(hv - ref).toFixed(2) });
    if (EMA && !r.shut && r.fBar) {  // the EMA's newest point: the minute before it, one step towards the forming close
      const prev = D.rows.slice(-3, -1).reverse().find(q => EMAV.has(q.x)), a = 2 / (EMA + 1);
      if (prev) { const e = EMAV.get(prev.x) + a * (r.fBar.c - EMAV.get(prev.x)); EMAV.set(r.x, e); sEma.update({ time: x, value: +e.toFixed(2) }); }
    }
    if (D.wk) wkLabels(D);  // Hyperliquid's move since the weekend close, at the newest minute
  } catch (e) { redraw(); return; }
  VAL.set(x, { h: hv, d: hv != null && ref != null ? +(hv - ref).toFixed(2) : null });
  if (hoverT == null) readout(null);
}
setInterval(() => { if (LIVE && built && DAYK === curKey()) redraw(); }, 15000);  // the strategy line, markers and the rest catch up
setInterval(() => { if (LIVE && DAYK !== curKey()) redraw(); }, 20000);
setInterval(async () => { if (await readIndexes() && built) show(DAYK, true); }, 5 * MIN);  // a saved day published since (the VPS writes them after midnight UTC)
NsbStatus.add('Hyperliquid', () => {
  const open = hlWs && hlWs.readyState === WebSocket.OPEN, fresh = open && Date.now() - hlLast < 90000;
  return { state: fresh ? 'live' : open ? 'quiet' : hlDownAt && Date.now() - hlDownAt > 60000 ? 'down' : 'reconnecting', last: hlLast || undefined };
});

(async () => {
  controls();
  NsbLive.start('VPS live stream', () => [FUT], () => ({ want: [FUT], since: Math.floor((endOf(prevWd(curKey())) - 5 * HOUR) / DAY) * DAY }));
  // (the chart font first: the charts keep a label's first measured width, so a label measured in the stand-in font is cut short)
  await Promise.all([readIndexes(), NsbLive.ready(1500), Promise.race([document.fonts.load('11px "IBM Plex Mono"').catch(() => null), sleep(3000)])]);
  hlConnect();
  const q = new URLSearchParams(location.search).get('day');
  const start = q && /^\d{4}-\d\d-\d\d$/.test(q) && isWd(q) ? q : curKey(); LIVE = start === curKey();
  await show(start);
})().catch(e => { $('loading-text').textContent = 'Could not load: ' + (e && e.message || e); });
</script>
