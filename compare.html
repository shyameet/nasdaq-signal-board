<style>
  .iq-lock { height: 26px; width: auto; display: block; flex: none; }
  /* The Compare page (owner 1/11/2026): two charts side by side, each on its own market (the board's own markets only:
     owner 1/11, "we don't need the picker thing for now" for every Hyperliquid market and every NSE stock), each on its
     market's newest day in 1-minute candles, live (owner 1/11: "no need for single chart option ... time candles option or
     even date, dont keep it complex"; older days by scrolling left), with the same header, price chart, Entry, Trend and
     Swing panes as the Perps tab. Each market keeps its own tab's day and data. Watching only. */
  :root {
    color-scheme: dark;
    --bg: #0a0d12; --surface: #0e131a; --tile: #121922; --tile-2: #161e29; --line: #1c2430; --line-strong: #283240;
    --text: #e8eef6; --muted: #8d99ab; --faint: #5c6879; --up: #2bb68a; --down: #f0555f; --accent: #5b8cff; --warn: #f2b33d;
    --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --font-num: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 13px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }
  button, select, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* ---- top bar ---- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; padding: 5px 10px;
            background: var(--surface); border-bottom: 1px solid var(--line); }
  .brand { display: flex; align-items: center; gap: 10px; }
  .topbar .brand .iq-lock { height: 24px; }
  .tabs { display: inline-flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .tabs a { padding: 4px 9px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 12.5px; font-weight: 500; }
  .tabs a:hover { color: var(--text); }
  .tabs a[aria-current="page"] { background: var(--tile); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .spacer { flex: 1; }
  .topbar .grp { display: inline-flex; align-items: center; padding: 0 0 0 8px; border-left: 1px solid var(--line); gap: 4px; }
  .older { position: fixed; left: 12px; bottom: 12px; z-index: 40; padding: 5px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
           background: var(--surface); color: var(--muted); font-size: 12px; }
  .older[hidden] { display: none; }
  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .seg button { padding: 3px 7px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); cursor: pointer;
                font-family: var(--font-ui); font-size: 12px; white-space: nowrap; }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--tile); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .btn { padding: 3px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); cursor: pointer;
         font-size: 12px; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: var(--line-strong); background: var(--tile); }

  /* ---- the charts: two side by side ---- */
  .board { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .panel { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .panel + .panel { border-left: 1px solid var(--line-strong); }
  /* each chart's own header: its market, then the Perps tab's readout */
  .phead { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 10px; border-bottom: 1px solid var(--line); min-width: 0; }
  .pctl { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; min-width: 0; }
  .pname { font-size: 14px; font-weight: 700; line-height: 20px; letter-spacing: .01em; white-space: nowrap; }
  .pval { font: 600 14px/20px var(--font-num); margin-left: -2px; white-space: nowrap; }
  .gw { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 6px; background: var(--tile);
        color: var(--muted); font-weight: 700; font-size: 11.5px; letter-spacing: .08em; white-space: nowrap; }
  .gw.bull { background: var(--up); color: #04150f; } .gw.bear { background: var(--down); color: #1e0507; }
  .gk { color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .gate { display: inline-flex; align-items: center; gap: inherit; white-space: nowrap; }   /* the gate word never wraps away from its label */
  .conds { display: inline-flex; gap: 8px; font: 11.5px var(--font-num); color: var(--muted); white-space: nowrap; }
  .conds b { font-weight: 600; }
  .warm { color: var(--warn); font-size: 11px; }
  .stack { flex: 1; min-height: 0; display: grid; grid-template-rows: 52fr 14fr 17fr 17fr; }   /* price, Entry, Trend, Swing (as on the Perps tab) */
  .pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; border-bottom: 1px solid var(--line); }
  .tag { position: absolute; top: 4px; left: 10px; z-index: 5; display: inline-flex; align-items: center; gap: 7px; max-width: calc(100% - 90px);
         padding: 3px 8px; border-radius: 6px; background: rgba(10, 13, 18, .78); pointer-events: none; font-size: 11.5px; color: var(--muted);
         white-space: nowrap; overflow: hidden; }
  .tag b { color: var(--text); font-weight: 600; }
  .tag.main { flex-wrap: wrap; row-gap: 2px; white-space: normal; font-family: var(--font-num); }
  .tag.main b { font-family: var(--font-ui); }
  .tag .sw { width: 11px; height: 3px; border-radius: 2px; display: inline-block; vertical-align: middle; }
  .tag .t-ema { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-ui); }
  .pane .tag.mix { max-width: calc(100% - 90px); }

  /* the market search (a box over every market; the list opens under it) */
  .ip-in { width: 11em; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text);
           font: 600 12px var(--font-ui); }
  .ip-in:hover { border-color: var(--line-strong); }
  .ip-in::placeholder { color: var(--faint); font-weight: 400; }
  .ip-pop { position: fixed; z-index: 60; overflow-y: auto; padding: 6px; border: 1px solid var(--line-strong); border-radius: 10px;
            background: var(--surface); box-shadow: 0 16px 48px rgba(0, 0, 0, .55); font: 12px var(--font-ui); }
  .ip-pop[hidden] { display: none; }
  .ip-g { padding: 6px 8px 3px; color: var(--faint); font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
  .ip-it { display: flex; width: 100%; align-items: baseline; gap: 8px; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent;
           color: var(--text); cursor: pointer; text-align: left; }
  .ip-it b { font: 600 12px var(--font-num); white-space: nowrap; }
  .ip-it span { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .ip-it:hover, .ip-it.hi { background: var(--tile); }
  .ip-it.on b { color: var(--accent); }
  .ip-none { padding: 8px; color: var(--muted); }

  #loading, .ploading { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: var(--bg); color: var(--muted); }
  #loading { position: fixed; inset: 0; z-index: 50; }
  .ploading { position: absolute; inset: 0; z-index: 30; background: rgba(10, 13, 18, .88); }
  #loading[hidden], .ploading[hidden] { display: none; }
  #loading img { width: 64px; height: 64px; }
  #loading div, .ploading div { display: flex; align-items: center; gap: 10px; }
  #loading div::before, .ploading div::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong);
                         border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 1100px) {
    html, body { height: auto; }
    .board { grid-template-columns: minmax(0, 1fr); }
    .panel { height: 92vh; min-height: 600px; }
    .panel + .panel { border-left: 0; border-top: 1px solid var(--line-strong); }
  }
  /* tablet width: as on the other tabs, the bar tightens so everything fits on one row */
  @media (max-width: 1499px) {
    .topbar { gap: 4px 6px; padding-left: 8px; padding-right: 8px; }
    .topbar .grp { padding-left: 6px; gap: 3px; }
    .topbar .brand .iq-lock { content: url(brand/iq_emblem.svg); height: 24px; }
    .topbar .tabs a { padding: 4px 7px; }
    .topbar .btn, .topbar .lb-btn { padding-left: 7px; padding-right: 7px; }
    .topbar .spacer { flex: 1 1 0; min-width: 0; }
    .lv.live > span { display: none; }
    .phead { gap: 4px 8px; padding-left: 8px; padding-right: 8px; }
  }
</style>

<script>
'use strict';
const DAY = 86400000, MIN = 60000, HOUR = 3600000, IST = 19800000;  // India: UTC+5:30 all year
const { TrendSignal, SHOWN, contiguous, toBar, flat, candleRows, BENCH } = NdxEngine.internals;
NdxEngine.internals.keep(Infinity);  // every loaded day runs through one TrendSignal: keep all of it
const { MacdPane, DayLines, Bands } = NsbMacd;
const C = { up: '#2bb68a', down: '#f0555f', grid: '#121821', text: '#7d899b', line: '#1c2430', cross: 'rgba(232, 238, 246, 0.85)', label: '#283240',
            bg: '#0a0d12' };
const ZONE = { BULLISH: 'rgba(43, 182, 138, 0.11)', BEARISH: 'rgba(240, 85, 95, 0.10)' };
const WORD = { BULLISH: 'LONG', BEARISH: 'SHORT', NEUTRAL: 'NO TRADE' };
const RULES = [['5m waves', '5m'], ['9m waves', '9m'], ['11m waves', '11m'], ['5m EMA21 vs EMA47', '5m 21/47']];  // the RDX WIP gate's conditions
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WKD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const $ = id => document.getElementById(id);
const two = n => String(n).padStart(2, '0');
const sec = ms => Math.floor(ms / 1000);
const ok = v => v !== null && v !== undefined && isFinite(v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const num = (v, d = 2) => ok(v) ? v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
// times in IST (owner 1/11/2026: "Axis/readout times in IST"), as on the India and Commodities tabs
const hhmm = ms => { const d = new Date(ms + IST); return `${two(d.getUTCHours())}:${two(d.getUTCMinutes())}`; };
const when = ms => { const d = new Date(ms + IST); return `${WKD[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]} ${hhmm(ms)}`; };
const dayKey = ms => new Date(ms).toISOString().slice(0, 10);          // UTC day (how candles are fetched and archived)
const dayStart = key => Date.parse(key + 'T00:00:00Z');
const kind = st => st === 'BULLISH' ? 'bull' : st === 'BEARISH' ? 'bear' : '';
const iso = n => new Date(n * DAY).toISOString().slice(0, 10), no = k => Math.round(Date.parse(k + 'T00:00:00Z') / DAY);
const nextKey = k => iso(no(k) + 1), prevKey = k => iso(no(k) - 1);
// bars restart each day at the market's origin: ms after 00:00 UTC (0 for Hyperliquid, its session open for NSE, GIFT
// and MCX), or 'cme', the CME open (cme.js), as on each market's own tab
const day0Of = (t, o) => o === 'cme' ? NsbCme.day0(t) : t - ((t - o) % DAY + DAY) % DAY;
const dayEndOf = (t, o) => o === 'cme' ? NsbCme.dayEnd(t) : day0Of(t, o) + DAY;
const bucketStart = (t, m, o = 0) => { const d0 = day0Of(t, o), s = m * MIN; return d0 + Math.floor((t - d0) / s) * s; };
const bucketEnd = (t, m, o = 0) => Math.min(bucketStart(t, m, o) + m * MIN, dayEndOf(t, o));
const pref = (k, fallback) => { try { const v = localStorage.getItem('nsb.compare.' + k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } };
const save = (k, v) => { try { localStorage.setItem('nsb.compare.' + k, JSON.stringify(v)); } catch (e) {} };

// ---- each market's day: its own tab's (owner 1/11/2026) ------------------------------------------------------------
// ist: the Perps tab's Indian calendar day, 00:00 to 24:00 IST (Hyperliquid markets); cme: the CME trading day from
// 17:00 Chicago (the Nasdaq tab's composite and XYZ100, the CME futures, and MCX as on the Commodities tab); india: the
// India tab's day, 06:30 IST (GIFT NIFTY's open) to 06:30 the next morning
const CAL = {
  ist: { key: t => iso(Math.floor((t + IST) / DAY)), open: k => no(k) * DAY - IST, title: 'Day (India: 00:00 to 24:00 IST)' },
  cme: { key: t => NsbCme.key(t), open: k => NsbCme.open(k), title: 'Trading day (from the CME open, 17:00 Chicago: 03:30 IST, 04:30 IST in its winter time)' },
  india: { key: t => iso(Math.floor((t + IST - 6.5 * HOUR) / DAY)), open: k => no(k) * DAY - IST + 6.5 * HOUR, title: 'Day (IST)' },
};
const weekday = k => { const w = new Date(k + 'T00:00:00Z').getUTCDay(); return w >= 1 && w <= 5; };
class IstDayLines extends DayLines {  // the day lines at midnight India time, dated by the Indian date (as on the Perps tab)
  updateAllViews() {
    const bars = this.bars(), ts = this.chart().timeScale(), out = [], dayNo = t => Math.floor((t + IST) / DAY);
    const x0 = bars.length > 1 ? ts.logicalToCoordinate(0) : null, x1 = bars.length > 1 ? ts.logicalToCoordinate(1) : null, r = ts.getVisibleLogicalRange();
    if (x0 !== null && x1 !== null && r) {
      const step = x1 - x0, lo = Math.min(bars.length - 1, Math.max(0, Math.floor(r.from) - 1)), hi = Math.min(bars.length - 1, Math.ceil(r.to) + 1);
      let prev = dayNo(bars[lo].time);
      for (let i = lo + 1; i <= hi; i++) {
        const k = dayNo(bars[i].time);
        if (k === prev) continue;
        prev = k;
        const d = new Date(k * DAY);
        out.push([x0 + (i - 0.5) * step, `${WKD[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`]);
      }
    }
    this.lines = out;
  }
}

// ---- the markets -------------------------------------------------------------------------------------------------
// The board's own (the VPS's files and live stream), with their tabs' decimals: CME futures (data/futures/1m, NinjaTrader),
// MCX (the same files, Dhan), India (data/india/1m, Dhan)
const NSE_OPEN = 3 * HOUR + 45 * MIN, GIFT_OPEN = HOUR, MCX_OPEN = 3 * HOUR + 30 * MIN;
const VPS = {
  MNQ: { name: 'MNQ', sub: 'CME micro Nasdaq-100', kind: 'fut', origin: 'cme', digits: 2, macdDigits: 2 },
  MCL: { name: 'MCL', sub: 'CME micro WTI crude', kind: 'fut', origin: 'cme', digits: 2, macdDigits: 3 },
  NG: { name: 'NG', sub: 'CME natural gas', kind: 'fut', origin: 'cme', digits: 3, macdDigits: 4 },
  MGC: { name: 'MGC', sub: 'CME micro gold', kind: 'fut', origin: 'cme', digits: 1, macdDigits: 2 },
  SIL: { name: 'SIL', sub: 'CME micro silver', kind: 'fut', origin: 'cme', digits: 3, macdDigits: 3 },
  MHG: { name: 'MHG', sub: 'CME micro copper', kind: 'fut', origin: 'cme', digits: 4, macdDigits: 4 },
  CRUDEOILM: { name: 'CRUDEOILM', sub: 'MCX crude oil mini', kind: 'fut', origin: MCX_OPEN, digits: 0, macdDigits: 2 },
  NATGASMINI: { name: 'NATGASMINI', sub: 'MCX natural gas mini', kind: 'fut', origin: MCX_OPEN, digits: 1, macdDigits: 3 },
  GOLDM: { name: 'GOLDM', sub: 'MCX gold mini', kind: 'fut', origin: MCX_OPEN, digits: 0, macdDigits: 1 },
  SILVERM: { name: 'SILVERM', sub: 'MCX silver mini', kind: 'fut', origin: MCX_OPEN, digits: 0, macdDigits: 1 },
  COPPER: { name: 'COPPER', sub: 'MCX copper', kind: 'fut', origin: MCX_OPEN, digits: 2, macdDigits: 2 },
  NIFTY: { name: 'NIFTY 50', sub: 'NSE index', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 2 },
  BANKNIFTY: { name: 'NIFTY BANK', sub: 'NSE index', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 2 },
  GIFTNIFTY: { name: 'GIFT NIFTY', sub: 'NSE IX', kind: 'india', origin: GIFT_OPEN, digits: 1, macdDigits: 2 },
  RELIANCE: { name: 'RELIANCE', sub: 'Reliance Industries', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
  HDFCBANK: { name: 'HDFC BANK', sub: 'HDFC Bank', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
  ICICIBANK: { name: 'ICICI BANK', sub: 'ICICI Bank', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
  BHARTIARTL: { name: 'BHARTI AIRTEL', sub: 'Bharti Airtel', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
  LT: { name: 'L&T', sub: 'Larsen & Toubro', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
  KOTAKBANK: { name: 'KOTAK BANK', sub: 'Kotak Mahindra Bank', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
  AXISBANK: { name: 'AXIS BANK', sub: 'Axis Bank', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
  SBIN: { name: 'SBI', sub: 'State Bank of India', kind: 'india', origin: NSE_OPEN, digits: 2, macdDigits: 3 },
};
const DEFAULTS = { a: 'hl:' + BENCH, b: 'MNQ' };  // a first visit: the Nasdaq tab's pair, XYZ100 and MNQ
let BASKET = null, PERPS = { members: {}, crypto: {} }, ACTIVE = [];
const tk = c => c.replace(/^xyz:/, '');
const hlName = c => PERPS.members[c] ? PERPS.members[c].ticker : /^xyz:/.test(c) || !c.includes(':') ? tk(c) : c;  // xyz's and the main dex's by name; another dex's with its dex
// the Nasdaq tab's composite: your stocks (the pick every tab shares), each counting equally
const SEL_KEY = 'nsb.div.stocks';
const ALL = () => Object.keys(BASKET.members);
const DEFAULT = () => (BASKET.default ? ALL().filter(c => BASKET.default.includes(c)) : ALL());
function readPick() {
  let a = null;
  try { a = JSON.parse(localStorage.getItem(SEL_KEY)); } catch (e) {}
  const pick = Array.isArray(a) ? ALL().filter(c => a.includes(c)) : [];
  ACTIVE = pick.length ? pick : DEFAULT();
}
const custom = () => ACTIVE.join() !== DEFAULT().join();
const leftName = () => custom() ? (ACTIVE.length <= 3 ? ACTIVE.map(tk).join('+') : `Basket ${ACTIVE.length}`) : 'NDX10';
const composite = () => Object.fromEntries(ACTIVE.map(c => [c, BASKET.base / ACTIVE.length / BASKET.members[c].ref_price]));
// One market: everything a chart needs to know about it. kind 'hl' (a Hyperliquid market of the board's: the Nasdaq tab's
// stocks and XYZ100, the Perps tab's stocks and crypto; any other is refused, a saved one too), 'comp' (your stocks), 'fut'
// (CME and MCX futures) or 'india'; its day (CAL), its candles' origin, where its day lines go, its Swing candles
// (swing.js), and how many days are shown, warmed up on and added at the left edge (its tab's).
function instOf(id) {

  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (bars[mid].time <= t) lo = mid; else hi = mid; }
  return lo + (t - bars[lo].time) / (bars[hi].time - bars[lo].time);
}

// ---- two charts in step ------------------------------------------------------------------------------------------
// The other chart ends at the time the one you move ends, with as many candles (as on the MNQ and India tabs: two markets
// with different hours line up on their right edge, not on one stretch of time). Only the chart you are moving (pressed,
// scrolled or zoomed last: `driver`) passes its moves on; the charts apply a range a frame late, so passing on every
// chart's changes would let the other pull the one being dragged back.
let driver = null, syncing = false;
function syncOther(src, force = false) {
  if (syncing || (!force && src !== driver)) return;
  const other = panelList().find(p => p !== src);
  if (!other || !other.main || !src.mainBars.length || !other.mainBars.length) return;
  const r = src.main.timeScale().getVisibleLogicalRange();
  if (!r) return;
  // never past its own newest candle, nor before its first (1/11/2026: a crypto Sunday beside MNQ's Friday left MNQ blank)
  const n = other.mainBars.length, span = r.to - r.from;
  const end = Math.max(Math.min(indexAt(other.mainBars, other.tf, timeAt(src.mainBars, src.tf, r.to)), n - 1 + 4), Math.min(span - 1, n - 1 + 4));
  const to = { from: end - span, to: end };
  const now = other.main.timeScale().getVisibleLogicalRange();
  if (now && Math.abs(now.from - to.from) < 0.01 && Math.abs(now.to - to.to) < 0.01) return;  // already there: no echo back

let hovering = false, pressedChart = null;  // pressedChart: the chart (or pane) last pressed: a finger moves its crosshair
let hoverAt = 0, hoverT, hoverSrc = null, finger = false;  // when the crosshair last moved, to which candle and on which chart, and if the last press was a finger
// a finger's readout is held while the finger that moved the crosshair is down, and for 5 s after it lifts (a hovering pen's
// for 5 s after it last moved); the chart's own re-checks after new data are no move (31/10/2026)
const chartFingers = new Map();
let fingerHeld = false, fingerAt = 0, fingerUp = 0, penHover = 0, scrollAt = 0;
const inPlot = (e, o) => { const r = o.chart.chartElement().getBoundingClientRect();  // on the chart, off its price and time axes
  return e.clientX >= r.left && e.clientX < r.right - o.chart.priceScale('right').width() && e.clientY >= r.top && e.clientY < r.bottom - o.chart.timeScale().height(); };
document.addEventListener('pointerdown', e => {
  finger = e.pointerType !== 'mouse';
  if (!finger) return;
  if (e.isPrimary) {  // the only one of its kind down (a lost lift heals here)
    for (const [id, type] of chartFingers) if (type === e.pointerType) chartFingers.delete(id);
    if (!chartFingers.size) fingerHeld = false;
  }
  if (allCharts().some(o => o.chart.chartElement().contains(e.target) && inPlot(e, o))) chartFingers.set(e.pointerId, e.pointerType);
}, true);
document.addEventListener('pointermove', e => {
  if (!finger || !(e.pointerType === 'mouse' || (e.pointerType === 'pen' && !e.buttons))) return;
  if (!allCharts().some(o => o.chart.chartElement().contains(e.target))) return;
  if (e.pointerType === 'mouse') finger = false;  // the mouse on a chart after a tap (a touch laptop): the mouse's again
  else penHover = Date.now();
}, true);
for (const k of ['pointerup', 'pointercancel']) document.addEventListener(k, e => {

}, true);
const hoverHeld = () => hovering && (!finger || fingerHeld || Date.now() - fingerAt < 5000);  // live prices leave the readout under the crosshair alone

// and session open), and the minute its header reads: that candle's last one, never past src's candle
function ownAt(p, t, src) {

  return [own, Math.min(own * 1000 + p.tf * MIN - MIN, t * 1000 + s.tf * MIN - MIN)];
}
function hoverAll(src, t, moved) {  // moved: the crosshair's own move (its event), not a re-check

  if (src) hoverSrc = src;
  if (!finger) fingerAt = hoverAt;

    fingerAt = hoverAt; fingerHeld = chartFingers.size > 0;
  }
  const shown = hoverHeld() ? t : undefined;
  NsbMacd.showValues(hovering && !finger);  // the lines' values in the pane labels: a mouse's only (31/10/2026)
  for (const p of panelList()) {
    if (!p.main) continue;
    const [own] = ownAt(p, t, src), [ownShown, minute] = ownAt(p, shown, src);
    if (p !== src) for (const o of p.charts) { const v = own === undefined ? null : o.value(own); if (ok(v)) o.chart.setCrosshairPosition(v, own, o.series); else o.chart.clearCrosshairPosition(); }
    p.tags(ownShown); p.head(minute);
  }
}
// a mouse drag of a chart let go off the charts ends the hover (31/10/2026)
let dragging = false;
const allCharts = () => panelList().flatMap(p => p.charts || []);
document.addEventListener('pointerdown', e => { dragging = e.pointerType === 'mouse' && allCharts().some(o => o.chart.chartElement().contains(e.target)); }, true);
document.addEventListener('pointerup', e => {
  const was = dragging; dragging = false;
  if (!was || !hovering) return;
  if (!allCharts().some(o => inPlot(e, o))) { for (const o of allCharts()) o.chart.clearCrosshairPosition(); hoverAll(null, undefined); }
}, true);
// the newest candle's readout, or the held crosshair's, unless the day or candle size just changed (31/10/2026)
function refreshText(fresh) {
  const t = !fresh && hoverHeld() ? hoverT : undefined;
  for (const p of panelList()) { if (!p.main) continue; const [own, minute] = ownAt(p, t, hoverSrc); p.tags(own); p.head(minute); }
}

// ---- the market search (owner 1/11/2026): every market of the board --------------------------------------------------
function groups() {
  const g = [];
  g.push(['Nasdaq', [...ALL().map(c => 'hl:' + c), 'hl:' + BENCH, 'comp']]);
  g.push(['CME futures', ['MNQ', 'MCL', 'NG', 'MGC', 'SIL', 'MHG']]);
  g.push(['MCX', ['CRUDEOILM', 'NATGASMINI', 'GOLDM', 'SILVERM', 'COPPER']]);
  g.push(['India', ['NIFTY', 'BANKNIFTY', 'GIFTNIFTY', 'RELIANCE', 'HDFCBANK', 'ICICIBANK', 'BHARTIARTL', 'LT', 'KOTAKBANK', 'AXISBANK', 'SBIN']]);
  g.push(['Perps · stocks', Object.keys(PERPS.members).map(c => 'hl:' + c)]);
  g.push(['Perps · crypto', Object.keys(PERPS.crypto).map(c => 'hl:' + c)]);
  return g;
}
// a list or calendar opened from a chart's header (fixed on the screen): under its control, or above it when there is no
// room below (the second chart's header low on a phone screen); placed again when the page scrolls or the keyboard opens
function placePop(pop, anchor, gap, fit) {  // fit: the list may shrink to the room it gets (it scrolls inside)
  const r = anchor.getBoundingClientRect(), vv = window.visualViewport;
  const top = vv ? vv.offsetTop : 0, bottom = Math.min(innerHeight, vv ? vv.offsetTop + vv.height : innerHeight);
  const below = bottom - r.bottom - gap - 8, above = r.top - top - gap - 8;
  const down = (fit ? below >= Math.min(200, above) : pop.offsetHeight <= below) || below >= above;
  if (fit) pop.style.maxHeight = `${Math.max(0, Math.round(down ? below : above))}px`;
  pop.style.top = `${Math.round(down ? r.bottom + gap : r.top - gap - pop.offsetHeight)}px`;
}
function placePops(e) {  // (not for a scroll inside the list itself)
  if (e && e.target && e.target.closest && e.target.closest('.ip-pop, .dp-pop')) return;
  for (const p of panelList()) p.picker.place();
}
window.addEventListener('scroll', placePops, { passive: true, capture: true });
window.addEventListener('resize', placePops);
if (window.visualViewport) { visualViewport.addEventListener('resize', placePops); visualViewport.addEventListener('scroll', placePops); }
class Picker {
  constructor(panel) {
    this.p = panel; this.q = $(`${panel.key}-q`); this.hi = -1;
    this.pop = document.createElement('div');
    this.pop.className = 'ip-pop'; this.pop.hidden = true; this.pop.setAttribute('role', 'listbox'); this.pop.setAttribute('aria-label', 'Markets');
    document.body.appendChild(this.pop);
    this.q.addEventListener('focus', () => { this.q.select(); this.open(true); });
    this.q.addEventListener('input', () => { this.hi = -1; this.redraw(); });
    this.q.addEventListener('keydown', e => {
      const items = [...this.pop.querySelectorAll('.ip-it')];
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        this.hi = Math.max(0, Math.min(items.length - 1, this.hi + (e.key === 'ArrowDown' ? 1 : -1)));
        items.forEach((b, i) => b.classList.toggle('hi', i === this.hi));
        if (items[this.hi]) items[this.hi].scrollIntoView({ block: 'nearest' });
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const b = items[this.hi >= 0 ? this.hi : 0];
        if (b) this.pick(b.dataset.id);
      } else if (e.key === 'Escape') { this.q.blur(); }
    });
    this.q.addEventListener('blur', () => setTimeout(() => { if (document.activeElement !== this.q) { this.open(false); this.reset(); } }, 150));
    this.pop.addEventListener('pointerdown', e => e.preventDefault());  // the box keeps the focus
    this.pop.addEventListener('click', e => { const b = e.target.closest('.ip-it'); if (b) this.pick(b.dataset.id); });
    this.reset();
  }
  reset() { const i = this.p.inst; this.q.value = i ? i.label : ''; this.q.title = i ? `${i.label}${i.sub ? ' · ' + i.sub : ''}: type to search` : 'The market shown: type to search'; }
  remove() { this.pop.remove(); }
  open(on) {
    this.pop.hidden = !on;
    if (!on) return;
    this.redraw();
    this.place();
  }
  place() {  // under the box, or above it when the box sits low on the screen (a phone); again when the page scrolls
    if (this.pop.hidden) return;
    const r = this.q.getBoundingClientRect(), w = Math.min(340, innerWidth - 16), s = this.pop.style;
    s.width = `${w}px`; s.left = `${Math.round(Math.max(8, Math.min(r.left, innerWidth - w - 8)))}px`;

  }

    let html = '';
    for (const [title, ids] of groups()) {
      const items = ids.map(id => [id, instOf(id)]).filter(([, i]) => i)
        .filter(([id, i]) => !typed || !q || `${i.label} ${i.sub} ${id.replace(/^hl:/, '')} ${title}`.toLowerCase().includes(q));
      if (!items.length) continue;
      html += `<div class="ip-g">${esc(title)}</div>` + items.map(([id, i]) => `<button type="button" class="ip-it${id === cur ? ' on' : ''}" data-id="${esc(id)}" role="option">`
        + `<b>${esc(i.label)}</b><span>${esc(i.sub || (id === 'comp' ? `${leftName()} · ${ACTIVE.length} stocks` : ''))}</span></button>`).join('');
    }

  }
  async pick(id) {
    const inst = instOf(id);

    this.q.value = inst.label;

  }
}

// ---- the two charts' markets: the last ones picked, else the Nasdaq tab's pair ----------------------------------------
function startPanel(p) { return p.show(instOf(pref(p.key, DEFAULTS[p.key])) || instOf(DEFAULTS[p.key])); }

// ---- live: Hyperliquid's candle stream, one subscription per Hyperliquid market shown ---------------------------------
let liveWs = null, liveTextAt = 0, hlLast = 0, hlDown = 0, subbed = new Set();
NsbStatus.add('Hyperliquid live stream', () => {  // its replies to the 30 s ping keep it fresh in a quiet market
  const fresh = liveWs && liveWs.readyState === WebSocket.OPEN && Date.now() - hlLast < 45000;
  return { state: fresh ? 'live' : hlDown && Date.now() - hlDown > 60000 ? 'down' : 'reconnecting', last: hlLast };
});
const thisMinute = () => Math.floor(Date.now() / MIN) * MIN;
const sub = (method, coin) => JSON.stringify({ method, subscription: { type: 'candle', coin, interval: '1m' } });
const wanted = () => new Set(panelList().flatMap(p => !p.inst ? [] : p.inst.kind === 'hl' ? [p.inst.coin] : p.inst.kind === 'comp' ? ACTIVE : []));
function liveConnect() {
  const ws = liveWs = new WebSocket('wss://api.hyperliquid.xyz/ws');
  ws.onopen = () => { subbed = new Set(); liveSync(); };
  ws.onmessage = e => { hlLast = Date.now(); hlDown = 0; let m; try { m = JSON.parse(e.data); } catch (x) { return; } if (m.channel === 'candle' && m.data) liveCandle(m.data); };
  ws.onclose = () => { if (liveWs !== ws) return; if (!hlDown) hlDown = Date.now(); setTimeout(liveConnect, 3000); };
  ws.onerror = () => ws.close();
}
function liveSync() {  // the stream follows the markets shown
  if (!liveWs || liveWs.readyState !== WebSocket.OPEN) return;  // (a socket still opening subscribes them itself)
  const want = wanted();
  for (const c of subbed) if (!want.has(c)) liveWs.send(sub('unsubscribe', c));
  for (const c of want) if (!subbed.has(c)) liveWs.send(sub('subscribe', c));
  subbed = want;
}
setInterval(() => { if (liveWs && liveWs.readyState === WebSocket.OPEN) liveWs.send('{"method":"ping"}'); }, 30000);
function liveCandle(r) {
  const b = toBar(r), d = dayCache.get(dayKey(b.t)), e = d && d[r.s];
  if (!e || e.complete) return;  // a day not loaded (the next build fetches it whole)
  const a = e.bars;
  if (a.length && a[a.length - 1].t === b.t) a[a.length - 1] = b; else if (!a.length || b.t > a[a.length - 1].t) a.push(b); else return;
  if (b.t !== thisMinute()) return;
  for (const p of panelList()) if (p.shows(r.s)) liveTick(p);
}
function lastClose(c, t) {  // a market's latest close at or before minute t, from the loaded days
  for (const k of [dayKey(t), dayKey(t - DAY)]) {
    const d = dayCache.get(k), a = d && d[c] && d[c].bars;
    if (a) for (let i = a.length - 1; i >= 0; i--) if (a[i].t <= t) return a[i].c;
  }
  return null;
}
function liveTick(p) {  // chart p's newest candle at the latest price, between rebuilds
  if (!p.main || !p.day || !p.onToday()) return;
  const one = p.liveOne();
  if (!one) return;
  const bars = p.mainBars, last = bars[bars.length - 1], start = bucketStart(one.t, p.tf, p.inst.origin);
  if (!last || last.time > start) return;
  if (last.time === start) { last.close = one.c; last.high = Math.max(last.high, one.h); last.low = Math.min(last.low, one.l); }
  else bars.push({ time: start, open: one.o, high: one.h, low: one.l, close: one.c, volume: 0 });  // a new candle, until the rebuild draws it fully
  const b = bars[bars.length - 1];
  p.candles.update({ time: sec(b.time), open: b.open, high: b.high, low: b.low, close: b.close });
  const s = p.store.get(sec(b.time));
  if (s) Object.assign(s, { close: b.close, high: b.high, low: b.low }); else p.store.set(sec(b.time), { ...b, state: null });
  const newestHeld = hoverT !== undefined && hoverSrc === p && hoverT === sec(b.time);
  if ((!hoverHeld() || newestHeld) && Date.now() - liveTextAt > 250) { liveTextAt = Date.now(); refreshText(); }
}
// ---- live: the VPS's stream for the board's own markets (live.js), started once one of them is shown ------------------
let vpsStarted = false;
function startVps() { if (vpsStarted) return; vpsStarted = true; NsbLive.start('VPS live stream', () => panelList().filter(p => isVps(p.inst)).map(p => p.inst.sym)); }
NsbLive.on((kind, s) => {
  for (const p of panelList()) {
    if (!isVps(p.inst)) continue;
    if (kind === 'tick') { if (p.inst.sym === s && p.day) liveTick(p); }
    else if (kind === 'snapshot' || (kind === 'bar' && p.inst.sym === s)) p.soon(kind === 'snapshot' ? 0 : 700);  // a minute closed: once the others' bars are in too
  }
});
function everyMinute() {  // 2 s past each minute (its last trades in): the minute just closed joins the charts
  setTimeout(() => {
    for (const p of panelList()) p.minute();
    if (Date.now() - futRead >= 10 * MIN) readFut().then(() => NsbRolls.load());  // the futures' saved days, every 10 minutes
    everyMinute();
  }, MIN - Date.now() % MIN + 2000);
}
document.addEventListener('visibilitychange', () => { for (const p of panelList()) p.minute(); });

// ---- start ---------------------------------------------------------------------------------------------------
let loadingTimer = 0;
const loading = text => {
  clearTimeout(loadingTimer);
  if (text === null) { $('loading').hidden = true; return; }
  $('loading-text').textContent = text;
};
NsbMacd.onToggle(() => { for (const p of panelList()) { for (const pane of Object.values(p.macd)) pane.showLines(); if (p.zones) p.zones.update(); } refreshText(); });
(async () => {
  try {
    loading('Loading the list of markets…');
    const [b, j] = await Promise.all([fetch('basket.json', { cache: 'no-cache' }).then(r => r.json()), fetch('perps.json', { cache: 'no-cache' }).then(r => r.json())]);
    BASKET = b; PERPS = { members: j.members || {}, crypto: j.crypto || {} };
    readPick();
    await Promise.all([readArchives(), readFut(), readInd(), NsbRolls.load()]);
    // drawings: draw.js keeps one set of drawings per page at a time (NsbDraw.use switches the whole page), so the two charts
    // can't each keep their own: one set for the Compare page. Each price chart is added under its market (as on India and
    // Commodities), so a line keeps its price on the market it was drawn on, shows at the same % on the other chart, and
    // goes away with that market (back when a chart shows it again)
    NsbDraw.setup({ key: 'nsb.draw.compare', when });
    panels.a = new Panel('a');
    panels.b = new Panel('b');
    loading(null);
    liveConnect(); everyMinute();
    await Promise.all(panelList().map(startPanel));
  } catch (e) {
    loading(`Couldn't load the Compare page (${e.message}). Reload the page to try again.`);
  }
})();
