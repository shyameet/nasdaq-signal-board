  :root {

  body { margin: 0; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 13px/1.4 var(--font-ui); -webkit-font-smoothing: antialiased; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---- top bar ---- */
  .topbar { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; padding: 5px 10px;
            background: var(--surface); border-bottom: 1px solid var(--line); }

<script>
'use strict';
const DAY = 86400000, MIN = 60000, HOUR = 3600000, IST = 19800000;  // India: UTC+5:30 all year
const { Ema, TrendSignal, SHOWN, contiguous, toBar, flat, candleRows } = NdxEngine.internals;
NdxEngine.internals.keep(Infinity);  // every loaded day runs through one TrendSignal: keep all of it
const { MacdPane, DayLines, LINE, PANES } = NsbMacd;
const C = { up: '#2bb68a', down: '#f0555f', grid: '#121821', text: '#7d899b', line: '#1c2430', cross: 'rgba(232, 238, 246, 0.85)', label: '#283240',
            bg: '#0a0d12' };
const ZONE = { BULLISH: 'rgba(43, 182, 138, 0.11)', BEARISH: 'rgba(240, 85, 95, 0.10)' };
const SWING_ZONE = { BULLISH: 'rgba(43, 182, 138, 0.13)', BEARISH: 'rgba(240, 85, 95, 0.12)' };
const WORD = { BULLISH: 'LONG', BEARISH: 'SHORT', NEUTRAL: 'NO TRADE' };
const TFS = [1, 2, 3, 5];
const KINDS = [['Stocks', 'stocks'], ['Crypto', 'crypto']], FIRST = { stocks: 'xyz:NVDA', crypto: 'BTC' };  // the two lists, and who opens each
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const $ = id => document.getElementById(id);
const two = n => String(n).padStart(2, '0');
const sec = ms => Math.floor(ms / 1000);
const ok = v => v !== null && v !== undefined && isFinite(v);
const num = (v, d = 2) => ok(v) ? v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const hhmm = ms => { const d = new Date(ms); return `${two(d.getHours())}:${two(d.getMinutes())}`; };
const when = ms => new Date(ms).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const dayKey = ms => new Date(ms).toISOString().slice(0, 10);          // UTC day (how candles are fetched and archived)
const dayStart = key => Date.parse(key + 'T00:00:00Z');
const kind = st => st === 'BULLISH' ? 'bull' : st === 'BEARISH' ? 'bear' : '';
const bucketStart = (t, m) => { const d0 = t - (t % DAY), s = m * MIN; return d0 + Math.floor((t - d0) / s) * s; };
const bucketEnd = (t, m) => Math.min(bucketStart(t, m) + m * MIN, t - (t % DAY) + DAY);
const pref = (k, fallback) => { try { const v = localStorage.getItem('nsb.perps.' + k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } };
const save = (k, v) => { try { localStorage.setItem('nsb.perps.' + k, JSON.stringify(v)); } catch (e) {} };

// ---- the Indian calendar day (owner 31/10/2026: the strip's days run 00:00 to 24:00 India time) --------------------
// Day "YYYY-MM-DD" begins at 18:30 UTC the day before; it takes its candles from that UTC day's evening and its own UTC day.
const iso = n => new Date(n * DAY).toISOString().slice(0, 10), no = k => Math.round(Date.parse(k + 'T00:00:00Z') / DAY);
const Ist = { dayNo: t => Math.floor((t + IST) / DAY), key: t => iso(Math.floor((t + IST) / DAY)), open: k => no(k) * DAY - IST,
              next: k => iso(no(k) + 1), prev: k => iso(no(k) - 1) };
// ---- US market hours (owner 5/11/2026: "a button that only shows the charts between the us market hours ... not 24/7", the
// hours the options trade, 9:30 to 16:00 New York; the stocks only): the session of New York date k, its holidays (NYSE's
// rules: no session) and its 13:00 closes. The indicators are still worked out on every minute, 24/7: only the candles
// outside the session are not drawn ----------------------------------------------------------------------------------
const Us = (() => {
  const at = (y, m, d) => iso(Math.round(Date.UTC(y, m, d) / DAY)), wd = k => new Date(k + 'T00:00:00Z').getUTCDay();
  const nth = (y, m, w, n) => 1 + (w - new Date(Date.UTC(y, m, 1)).getUTCDay() + 7) % 7 + 7 * (n - 1);  // the n-th weekday w of month m
  const last = (y, m, w) => { const e = new Date(Date.UTC(y, m + 1, 0)); return e.getUTCDate() - (e.getUTCDay() - w + 7) % 7; };
  const observed = (y, m, d) => { const k = at(y, m, d), w = wd(k); return w === 6 ? at(y, m, d - 1) : w === 0 ? at(y, m, d + 1) : k; };
  const easter = y => { const a = y % 19, b = Math.floor(y / 100), c = y % 100, h = (19 * a + b - Math.floor(b / 4) - Math.floor((b - Math.floor((b + 8) / 25) + 1) / 3) + 15) % 30,
                               l = (32 + 2 * (b % 4) + 2 * Math.floor(c / 4) - h - c % 4) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
                         return [Math.floor((h + l - 7 * m + 114) / 31) - 1, (h + l - 7 * m + 114) % 31 + 1]; };
  const years = new Map();
  const yearOf = y => {
    if (years.has(y)) return years.get(y);
    const [em, ed] = easter(y);
    const off = new Set([...(wd(at(y, 0, 1)) === 6 ? [] : [observed(y, 0, 1)]),  // New Year's Day on a Saturday: not moved
      at(y, 0, nth(y, 0, 1, 3)), at(y, 1, nth(y, 1, 1, 3)), at(y, em, ed - 2), at(y, 4, last(y, 4, 1)), observed(y, 5, 19), observed(y, 6, 4),
      at(y, 8, nth(y, 8, 1, 1)), at(y, 10, nth(y, 10, 4, 4)), observed(y, 11, 25)]);
    const early = new Set([at(y, 10, nth(y, 10, 4, 4) + 1), at(y, 11, 24), at(y, 6, 3)].filter(k => !off.has(k) && wd(k) > 0 && wd(k) < 6));
    const r = { off, early };
    years.set(y, r);
    return r;
  };
  // New York on summer time, by day number (the switch is a Sunday): the year last asked about kept, as the day lines ask for
  // every candle on screen at every frame
  let yLo = 1, yHi = 0, sLo = 0, sHi = 0;
  const summerNo = n => {
    if (n < yLo || n >= yHi) { const y = new Date(n * DAY).getUTCFullYear(); yLo = no(at(y, 0, 1)); yHi = no(at(y + 1, 0, 1)); sLo = no(at(y, 2, nth(y, 2, 0, 2))); sHi = no(at(y, 10, nth(y, 10, 0, 1))); }
    return n >= sLo && n < sHi;
  };
  const open = k => no(k) * DAY + 9.5 * HOUR + (summerNo(no(k)) ? 4 : 5) * HOUR;  // 9:30 New York, in UTC ms
  const trades = k => { const w = wd(k); return w > 0 && w < 6 && !yearOf(+k.slice(0, 4)).off.has(k); };
  const close = k => open(k) + (yearOf(+k.slice(0, 4)).early.has(k) ? 3.5 : 6.5) * HOUR;  // 16:00, or 13:00
  const dayNo = t => { const n = Math.floor((t - 5 * HOUR) / DAY); return summerNo(n) ? Math.floor((t - 4 * HOUR) / DAY) : n; };  // New York's date, as a number
  const key = t => iso(dayNo(t));
  return { open, close, key, trades, dayNo, inSession: t => { const k = key(t); return trades(k) && t >= open(k) && t < close(k); } };
})();
const usOn = () => !!opt.us && KIND === 'stocks';  // the US hours shown (the switch, on a stock)
class IstDayLines extends DayLines {  // the day lines at midnight India time, dated by the Indian date (US hours: at each session's start, by New York's date)
  updateAllViews() {
    const bars = this.bars(), ts = this.chart().timeScale(), out = [], dayNo = usOn() ? Us.dayNo : Ist.dayNo;
    const x0 = bars.length > 1 ? ts.logicalToCoordinate(0) : null, x1 = bars.length > 1 ? ts.logicalToCoordinate(1) : null, r = ts.getVisibleLogicalRange();
    if (x0 !== null && x1 !== null && r) {
      const step = x1 - x0, lo = Math.min(bars.length - 1, Math.max(0, Math.floor(r.from) - 1)), hi = Math.min(bars.length - 1, Math.ceil(r.to) + 1);
      let prev = dayNo(bars[lo].time);
      for (let i = lo + 1; i <= hi; i++) {
        const k = dayNo(bars[i].time);
        if (k === prev) continue;
        prev = k;
        const d = new Date(k * DAY);
        out.push([x0 + (i - 0.5) * step, `${WEEKDAY[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`]);
      }
    }
    this.lines = out;
  }
}

// ---- the Swing pane (owner 31/10/2026; 1/11/2026: on every market, crypto too; 2/11/2026: its lines switched on count for
// the gate and the shading, gate.js) ----------------------------------------------------------------------------------
// Its lines (1h, 4h, 1D; and 1W, 1M on the stocks only, owner 1/11/2026), their switches (kept with the other panes' ones)
// and its candles: swing.js. The candles: the VPS's nightly long candles (data/swing/hl_<coin>.json; none:
// Hyperliquid's own), then candles from this page's closed minutes, so today's hour, day, week and month stay current. A
// stock perp's weeks and months begin with the real stock's days (data/swing/us_<ticker>.json).
const swingOf = c => LISTS.stocks.includes(c) ? { id: 'hl_' + c.replace(/:/g, '_'), hl: c, origin: 0, under: 'us_' + MEMBERS[c].ticker, wm: true }
                                              : { id: 'hl_' + c.replace(/:/g, '_'), hl: c, origin: 0 };
const closedRows = bars => { const now = Date.now(); return bars.filter(b => b.t + MIN <= now); };

// ---- settings (remembered in this browser) ----------------------------------------------------------------
const opt = {
  tf: TFS.includes(pref('tf', 1)) ? pref('tf', 1) : 1,
  us: pref('us', false) === true,  // the stocks' US hours only (Us)
};

// ---- data: one UTC day of 1-minute candles per market ----------------------------------------------------------
// From our daily archive (data/perps/1m/YYYY-MM-DD/<coin>.json, written by the VPS) when it has the day, else straight
// from Hyperliquid, which keeps about the last 3.5 days of 1-minute candles. Archived: the MyFundedPerps stocks and the
// crypto coins (ARCHIVED); every other stock (perps.json "more", owner 3/11/2026) only from Hyperliquid (owner's choice
// (a): no site space), so its calendar has its last 3 or 4 days.
let MEMBERS = {}, LISTS = {}, ALL = [], KIND = 'stocks', COIN = null, archiveDays = new Set(), hlFrom = Infinity;
let GROUPS = [], ARCHIVED = new Set();
const dayCache = new Map();  // UTC day -> { coin: { bars, source, complete } }
const tk = c => MEMBERS[c] ? MEMBERS[c].ticker : c.replace(/^xyz:/, '');
const fileOf = c => c.split(':').pop();  // the archive's name for it: Hyperliquid's own, without its dex (perps_days.py)
async function archiveIndex() {
  try {
    const r = await fetch('data/perps/1m/index.json', { cache: 'no-cache' });
    if (!r.ok) return new Set();
    const j = await r.json();
    return new Set((j.dates || []).map(String));
  } catch (e) { return new Set(); }
}
const hlEarliest = () => Date.now() - 4990 * MIN;  // a minute Hyperliquid surely still serves at 1m (it keeps the last 5000)
const filesOf = keys => [...new Set(keys.flatMap(k => [Ist.prev(k), k]))].sort();  // the UTC days the Indian days take candles from
const ended = key => Date.now() >= dayStart(key) + DAY + MIN;  // UTC day over, with a minute's grace
async function hlDay(c, d0, end) {
  return (await candleRows(c, '1m', d0, end)).map(toBar).filter(b => b.t >= d0 && b.t <= end).sort((a, b) => a.t - b.t);

  let lo = 0, hi = bars.length - 1, hit = null;
  while (lo <= hi) { const mid = (lo + hi) >> 1; if (bars[mid].time <= t) { hit = bars[mid]; lo = mid + 1; } else hi = mid - 1; }
  return hit;
}
function timeAt(bars, x) {  // candle position (fractional, may lie past either end) -> time
  const n = bars.length, tf = opt.tf * MIN;
  if (x <= 0) return bars[0].time + x * tf;
  if (x >= n - 1) return bars[n - 1].time + (x - n + 1) * tf;

  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (bars[mid].time <= t) lo = mid; else hi = mid; }

let hovering = false, pressedChart = null;
let hoverAt = 0, hoverT, finger = false;  // when the crosshair last moved and to which candle, and if the last press was a finger
// a finger's readout is held while the finger that moved the crosshair is down, and for 5 s after it lifts (a hovering pen's

// it held for good, and any touch brought it back)
const chartFingers = new Map();  // the fingers down on a chart's plot -> their pointer type
let fingerHeld = false, fingerAt = 0, fingerUp = 0, penHover = 0, scrollAt = 0;  // a finger down moved the crosshair; when the hold last renewed; when a finger last left a chart; when a pen last hovered one; when a finger's pan or pinch last moved a price chart
const inPlot = (e, o) => { const r = o.chart.chartElement().getBoundingClientRect();  // on the chart, off its price and time axes
  return e.clientX >= r.left && e.clientX < r.right - o.chart.priceScale('right').width() && e.clientY >= r.top && e.clientY < r.bottom - o.chart.timeScale().height(); };
document.addEventListener('pointerdown', e => {
  finger = e.pointerType !== 'mouse';

const hoverHeld = () => hovering && (!finger || fingerHeld || Date.now() - fingerAt < 5000);  // live prices leave the readout under the crosshair alone (as on the MNQ tab; a finger's for 5 s, as its crosshair stays)
function hoverAll(t, moved) {  // moved: the crosshair's own move (its event), not a re-check
  const was = hoverT;
  hovering = t !== undefined; hoverT = t; hoverAt = Date.now();

    fingerAt = hoverAt; fingerHeld = chartFingers.size > 0;  // a finger's move (or its lift's), or a hovering pen's
  }
  const shown = hoverHeld() ? t : undefined;
  // the chips' values: under a mouse only (31/10/2026: a finger's crosshair stays after a pan, and the chips, wider with
  // their values, slid under the next tap)

  for (const p of Object.values(panels)) { p.tags(shown); p.head(shown === undefined ? undefined : shown * 1000 + opt.tf * MIN - MIN); }
}
// a mouse drag of a chart let go off the charts ends the hover (31/10/2026: the chart kept the dragged crosshair, and the
// readout stayed on that candle while the price moved on)
let dragging = false;
const allCharts = () => Object.values(panels).flatMap(p => p.charts || []);
document.addEventListener('pointerdown', e => { dragging = e.pointerType === 'mouse' && allCharts().some(o => o.chart.chartElement().contains(e.target)); }, true);
document.addEventListener('pointerup', e => {
  const was = dragging; dragging = false;
  if (!was || !hovering) return;
  const onPlot = allCharts().some(o => inPlot(e, o));
  if (!onPlot) { for (const o of allCharts()) o.chart.clearCrosshairPosition(); hoverAll(undefined); }
}, true);

// ---- drawing ------------------------------------------------------------------------------------------------
function autoFit() {  // the A button in the price chart's corner (macd.js): the chart back as it opened, its prices fitted
  for (const p of Object.values(panels)) { p.main.priceScale('right').applyOptions({ autoScale: true }); p.fit(); }
}
function render(full) {
  for (const p of Object.values(panels)) p.draw();
  if (full) {  // and again once the chart has its final size
    const fit = () => { for (const p of Object.values(panels)) p.fit(); };
    fit(); requestAnimationFrame(() => requestAnimationFrame(fit)); setTimeout(fit, 150);
  }
  refreshText(full);
}
// the newest candle's readout, or the held crosshair's, unless the day or candle size just changed (31/10/2026: a switch
// click or the minute's rebuild put the newest candle's values beside an older candle's crosshair, and the chips moved)
function refreshText(fresh) {
  const t = !fresh && hoverHeld() ? hoverT : undefined;
  for (const p of Object.values(panels)) { p.tags(t); p.head(t === undefined ? undefined : t * 1000 + opt.tf * MIN - MIN); }
}
// ---- controls ----------------------------------------------------------------------------------------------
function seg(el, items, current, onPick) {
  el.innerHTML = items.map(([label, val]) => `<button type="button" data-v="${val}" aria-pressed="${String(val) === String(current)}">${label}</button>`).join('');
  for (const b of el.children) b.onclick = () => { onPick(b.dataset.v); for (const x of el.children) x.setAttribute('aria-pressed', String(x === b)); };
}
const picked = k => { const c = pref(k === 'stocks' ? 'stock' : 'crypto', null); return LISTS[k].includes(c) ? c : LISTS[k].includes(FIRST[k]) ? FIRST[k] : LISTS[k][0]; };

// ---- the market finder (owner 3/11/2026: "add all the stocks from hyperliquid but how would we categorize so much in a
// drop down list" -> "(a) The finder in the picture"; finder.js, shared with the Compare tab): the stocks' sector groups
// (perps.json "groups"), ★ My list, MyFundedPerps (the stocks it lists), All; crypto: its ten, busiest first. ‹ › step
// through the group shown, the busiest first, without opening it
let finder = null;
const groupOf = () => { if (KIND === 'crypto') return 'all'; const g = pref('group', null); return g && (['star', 'mfp', 'all'].includes(g) || GROUPS.some(x => x[0] === g)) ? g : NsbFinder.stars().length ? 'star' : 'mfp'; };
const groupName = g => g === 'star' ? 'My list' : g === 'mfp' ? 'MyFundedPerps' : g === 'all' ? (KIND === 'crypto' ? 'Crypto' : 'All') : (GROUPS.find(x => x[0] === g) || [g, g])[1];
const finderItems = () => LISTS[KIND].map(c => { const m = MEMBERS[c], mfp = KIND === 'stocks' && ARCHIVED.has(c);
  return { id: c, coin: c, ticker: tk(c), name: m.company, kind: m.kind, mfp, groups: [...(m.groups || []), ...(mfp ? ['mfp'] : [])], where: m.where }; });
function stepList() {  // the group's markets, busiest first; the market shown is not in it (found by searching): the whole list
  const g = groupOf(), list = finder.list(g);
  return list.includes(COIN) ? [list, g] : [finder.list('all'), 'all'];
}
async function step(d) {
  const [list] = stepList(), i = list.indexOf(COIN);
  if (list.length > 1) await showMarket(list[(i + d + list.length) % list.length], KIND);
  NsbFinder.loadStats(LISTS[KIND]).then(updatePick);
}
function updatePick() {  // the market button and "5 of 22 · Chips & memory"
  $('pickTk').textContent = COIN ? tk(COIN) : '—';
  $('pickCo').textContent = COIN && MEMBERS[COIN] ? MEMBERS[COIN].company : '';
  if (!finder || !COIN) { $('pickPos').textContent = ''; return; }
  const [list, g] = stepList();
  $('pickPos').textContent = `${list.indexOf(COIN) + 1} of ${list.length} · ${groupName(g)}`;
}
function finderEvents() {
  finder = NsbFinder.make({
    anchor: $('pickBtn'), items: finderItems, current: () => COIN, mfp: () => KIND === 'stocks',
    chips: () => KIND === 'crypto' ? [] : [['star', '★ My list'], ['mfp', 'MyFundedPerps'], ['all', 'All'], ...GROUPS],
    chip: groupOf, setChip: g => { save('group', g); updatePick(); }, onStars: updatePick,
    onPick: c => showMarket(c, KIND),
  });
  $('pickBtn').onclick = () => finder.toggle();
  $('prevBtn').onclick = () => step(-1);
  $('nextBtn').onclick = () => step(1);
  document.addEventListener('keydown', e => {  // "/" opens it (not while typing somewhere)
    if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target || {}).tagName || '') && !(e.target || {}).isContentEditable) { e.preventDefault(); finder.open(); }
  });
}
function buildControls() {
  seg($('kindSeg'), KINDS, KIND, pickKind);
  finderEvents();
  updatePick();
  $('tfs').innerHTML = TFS.map(m => `<option value="${m}"${m === opt.tf ? ' selected' : ''}>${m}m candles</option>`).join('');
  $('tfs').onchange = () => { opt.tf = +$('tfs').value; save('tf', opt.tf); render(true); };
  dayPick = DayPick($('dayPick'), { onPick: k => openDay(k), title: 'Day (India: 00:00 to 24:00 IST)' });
  seg($('hoursSeg'), [['24/7', 'all'], ['US hours', 'us']], opt.us ? 'us' : 'all', v => showHours(v === 'us'));
  $('hoursSeg').children[0].title = 'Every hour, around the clock';
  $('hoursSeg').children[1].title = 'Only the US market\'s hours, when the options trade: 9:30 to 16:00 New York (13:00 on its early-close days), Monday to Friday, no holidays. The lines are still worked out on every hour';
  hoursShown();
}
function hoursShown() { $('hoursGrp').style.display = KIND === 'stocks' ? '' : 'none'; }  // the stocks only
async function showHours(on) {  // 24/7 or the US hours: the same day again
  if (on === opt.us) return;
  opt.us = on; save('us', on);
  if (!day || KIND !== 'stocks') return;
  if (await openDay(day.key) === false) { opt.us = !on; save('us', !on); seg($('hoursSeg'), [['24/7', 'all'], ['US hours', 'us']], opt.us ? 'us' : 'all', v => showHours(v === 'us')); }
}
async function pickKind(k) {  // Stocks / Crypto: that list, at the market last shown from it
  if (k === KIND) return;
  finder.close();
  if (!await showMarket(picked(k), k)) seg($('kindSeg'), KINDS, KIND, pickKind);  // not loaded: the switch back as it was
}
async function showMarket(next, kind) {  // another market: its own drawings, its live candles, the same day (or its newest, when it has no such day)
  const was = COIN, wasKind = KIND, wasList = dayList;
  if (next === was) return true;
  const use = (c, k, list) => { COIN = c; KIND = k; ALL = LISTS[k]; dayList = list || listDays(); NsbDraw.use('nsb.draw.perps.' + fileOf(c)); updatePick(); hoursShown(); };
  // its unfinished days stopped when you left it (the stream follows the market shown only): fetched whole again
  // (31/10/2026: the minutes away were a flat line, never filled in)
  for (const d of dayCache.values()) if (d[next] && !d[next].complete) delete d[next];
  use(next, kind);
  liveSwap(was, next);
  if (await openDay(dayList.includes(day.key) ? day.key : dayList[0]) === false) {  // not loaded: back to the market the chart still shows

  }

function listDays() {  // newest first: the Indian days of the archived UTC days (the market shown has them) and of the days Hyperliquid still has
  const files = new Set(ARCHIVED.has(COIN) ? archiveDays : []), live = Ist.key(Date.now());
  for (let t = Date.now(); dayStart(dayKey(t)) + DAY > hlFrom; t -= DAY) files.add(dayKey(t));
  const keys = new Set([...files].filter(k => files.has(Ist.prev(k))).concat(live));  // Indian day k takes UTC days k-1 (evening) and k
  return [...keys].filter(k => Ist.open(k) <= Date.now()).sort().reverse();

// ---- today: new candles from Hyperliquid every minute, keeping your zoom ---------------------------------------
let refreshing = false, dayPick = null, dayList = [], olderBusy = false, opening = 0;
const SHOW_DAYS = 3, MORE_DAYS = 2;
async function loadOlder() {  // add older days to the strip, keeping what you are looking at in place
  if (olderBusy || refreshing || opening) return;
  olderBusy = true;
  $('older').hidden = false;
  try {
    if (!await buildDay(day.key, day.shown + MORE_DAYS, true)) return;
    const keep = Object.values(panels).filter(q => q.mainBars.length).map(q => {
      const r = q.main.timeScale().getVisibleLogicalRange();
      return [q, r ? [timeAt(q.mainBars, r.from), timeAt(q.mainBars, r.to)] : null];
    });
    render(false);
    for (const [q, span] of keep) if (span && q.mainBars.length) q.main.timeScale().setVisibleLogicalRange({ from: indexAt(q.mainBars, span[0]), to: indexAt(q.mainBars, span[1]) });
  } catch (e) { /* the next scroll tries again */ } finally { olderBusy = false; $('older').hidden = true; }
}
function keepView(fn) {  // rebuild, keeping the newest candles in view if you were looking at them
  const before = Object.fromEntries(Object.entries(panels).map(([k, q]) => {
    const r = q.main.timeScale().getVisibleLogicalRange(), n = q.mainBars.length;
    return [k, { r, n, atEnd: !r || r.to >= n - 2 }];
  }));
  fn();
  for (const [k, q] of Object.entries(panels)) {
    const b = before[k], added = q.mainBars.length - b.n;
    if (b.r && b.atEnd && added > 0) q.main.timeScale().setVisibleLogicalRange({ from: b.r.from + added, to: b.r.to + added });
  }
}
async function refreshToday() {
  if (refreshing || olderBusy || opening || !day || document.visibilityState !== 'visible') return;
  const today = Ist.key(Date.now()), was = day.key;
  refreshing = true;
  try {
    if (!dayList.includes(today)) {  // past midnight India time: a new day in the calendar
      const a = await archiveIndex();
      if (a.size) archiveDays = a;
      hlFrom = hlEarliest();
      const list = listDays();
      if (opening) return;
      if (day.key !== was) { dayList = list; dayPick.set(dayList, day.key, today); return; }
      if (Ist.prev(today) === was) {  // you were on today: follow it
        await topUp(filesOf([today]), COIN);
        if (day.key !== was || opening) return;
        const old = dayList;
        dayList = list;
        if (await openDay(today) === false) dayList = old;
        return;
      }
      dayList = list;
      dayPick.set(dayList, was, today);
    }
    if (day.key !== today) return;
    await topUp(filesOf([today]), COIN);
    if (day.key !== was || opening) return;

  } catch (e) { /* tried again next minute */ } finally { refreshing = false; }
}
setInterval(refreshToday, 60000);
document.addEventListener('visibilitychange', refreshToday);

// ---- live: Hyperliquid's candle stream, the market shown only ---------------------------------------------------
let liveWs = null, liveTimer = 0, liveTextAt = 0;
const thisMinute = () => Math.floor(Date.now() / MIN) * MIN;
const sub = (method, coin) => JSON.stringify({ method, subscription: { type: 'candle', coin, interval: '1m' } });
function liveConnect() {
  const ws = liveWs = new WebSocket('wss://api.hyperliquid.xyz/ws');
  ws.onopen = () => ws.send(sub('subscribe', COIN));
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (x) { return; } if (m.channel === 'candle' && m.data) liveCandle(m.data); };
  ws.onclose = () => { if (liveWs !== ws) return; setTimeout(liveConnect, 3000); };
  ws.onerror = () => ws.close();
}
function liveSwap(from, to) {  // the stream follows the market shown
  if (!liveWs || liveWs.readyState !== WebSocket.OPEN) return;  // (a socket still opening subscribes COIN itself)
  liveWs.send(sub('unsubscribe', from)); liveWs.send(sub('subscribe', to));
}
setInterval(() => { if (liveWs && liveWs.readyState === WebSocket.OPEN) liveWs.send('{"method":"ping"}'); }, 30000);
function liveCandle(r) {
  const b = toBar(r), d = dayCache.get(dayKey(b.t)), e = d && d[r.s];
  if (!e || e.complete) return;  // a day not loaded (the next build fetches it whole)
  const a = e.bars;
  if (a.length && a[a.length - 1].t === b.t) a[a.length - 1] = b; else if (!a.length || b.t > a[a.length - 1].t) a.push(b); else return;
  if (r.s !== COIN || !day || day.key !== Ist.key(Date.now())) return;  // looking at an older day: nothing on screen moves
  if (b.t === thisMinute()) liveTick();
}
function everyMinute() {  // 1.5 s past each minute: the minute just closed joins the chart
  clearTimeout(liveTimer);
  liveTimer = setTimeout(() => { liveRebuild(); everyMinute(); }, MIN - Date.now() % MIN + 1500);
}
function liveTick() {  // the newest candle at the latest price, between rebuilds
  const T = thisMinute();
  let newestHeld = false;
  for (const p of Object.values(panels)) {
    const bars = p.mainBars, last = bars[bars.length - 1];
    if (last && hoverT === sec(last.time)) newestHeld = true;
    if (!last || last.time !== bucketStart(T, opt.tf)) continue;
    const d = dayCache.get(dayKey(T)), a = d && d[COIN] && d[COIN].bars, one = a && a[a.length - 1];
    if (!one || one.t !== T) continue;
    last.close = one.c; last.high = Math.max(last.high, one.h); last.low = Math.min(last.low, one.l);
    const s = p.store.get(sec(last.time));  // first: the chart's re-check in update() writes the label from it
    if (s) Object.assign(s, { close: last.close, high: last.high, low: last.low });
    p.candles.update({ time: sec(last.time), open: last.open, high: last.high, low: last.low, close: last.close });
  }
  if ((!hoverHeld() || newestHeld) && Date.now() - liveTextAt > 250) { liveTextAt = Date.now(); refreshText(); }  // (31/10/2026: under the crosshair it flipped to the newest candle and back; the newest one held moves with the price)
}
async function liveRebuild() {  // a minute closed: today again with it
  if (refreshing || olderBusy || opening || !day) return;
  const today = Ist.key(Date.now()), was = day.key, coin = COIN;
  if (was !== today || !dayList.includes(today)) return;
  refreshing = true;
  try {
    if (!await buildDay(today, day.shown, true) || day.key !== was || COIN !== coin) return;
    keepView(() => render(false));
  } catch (e) { /* the minute refresh tries again */ } finally { refreshing = false; }
}
async function openDay(key) {  // the calendar, the market list, today's follow: a failed load says why for a moment, the day shown stays
  opening++;
  const run = buildDay(key), seq = builds;
  try {
    if (!await run) return;
    dayPick.set(dayList, key, Ist.key(Date.now()));
    render(true);
    return true;
  } catch (e) {
    if (!day) throw e;
    if (seq !== builds) return;
    const msg = `Couldn't load ${key} (${e.message})`;
    loading(msg);
    setTimeout(() => { if ($('loading-text').textContent === msg) loading(null); }, 3000);
    return false;
  } finally { opening--; }
}
let loadingNow = false, loadingTimer = 0;
const loading = text => {
  clearTimeout(loadingTimer);
  if (text === null) { loadingNow = false; $('loading').hidden = true; return; }
  loadingNow = true; $('loading-text').textContent = text;
  if ($('loading').hidden) loadingTimer = setTimeout(() => { if (loadingNow) $('loading').hidden = false; }, 400);
};

// ---- start ---------------------------------------------------------------------------------------------------
// a switch: the gate again (gate.js counts the lines switched on), then the candles' states, the shading, the header's
// word and chips, and the readout, without loading anything
NsbMacd.onToggle(() => { for (const p of Object.values(panels)) { if (day && day[p.key] && p.mainBars.length) p.gate(); for (const pane of Object.values(p.macd)) pane.showLines(); p.zones.update(); } if (day) refreshText(); });
(async () => {
  try {
    loading('Loading the list of days…');
    const j = await (await fetch('perps.json', { cache: 'no-cache' })).json();
    MEMBERS = { ...(j.more || {}), ...j.members, ...j.crypto };
    LISTS = { stocks: [...Object.keys(j.members), ...Object.keys(j.more || {})], crypto: Object.keys(j.crypto || {}) };
    ARCHIVED = new Set([...Object.keys(j.members), ...Object.keys(j.crypto || {})]);  // their every day archived (data/perps/1m)
    GROUPS = j.groups || [];
    KIND = pref('kind', 'stocks') === 'crypto' && LISTS.crypto.length ? 'crypto' : 'stocks';
    ALL = LISTS[KIND];
    COIN = picked(KIND);
    [archiveDays, hlFrom] = [await archiveIndex(), hlEarliest()];
    dayList = listDays();
    buildControls();
    NsbDraw.setup({ key: 'nsb.draw.perps.' + fileOf(COIN), when });
    panels.stock = new Panel('stock');
    await openDay(dayList[0]);  // today, updating every minute
    liveConnect(); everyMinute();
    NsbFinder.loadStats(LISTS[KIND]).then(updatePick);  // busiest first: the order ‹ › steps in
  } catch (e) {

  }
})();
