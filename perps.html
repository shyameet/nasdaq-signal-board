<style>

  /* The Perps page (owner 31/10/2026): one market at a time (the stock perps, or the crypto coins), one Indian calendar

  :root {
    color-scheme: dark;
    --bg: #0a0d12; --surface: #0e131a; --tile: #121922; --tile-2: #161e29; --line: #1c2430; --line-strong: #283240;

<script>
'use strict';
const DAY = 86400000, MIN = 60000, HOUR = 3600000, IST = 19800000;  // India: UTC+5:30 all year
const { Ema, TrendSignal, SHOWN, contiguous, toBar, flat, candleRows } = NdxEngine.internals;
NdxEngine.internals.keep(Infinity);  // every loaded day runs through one TrendSignal: keep all of it
const { MacdPane, DayLines, LINE, PANES } = NsbMacd;
const C = { up: '#2bb68a', down: '#f0555f', grid: '#121821', text: '#7d899b', line: '#1c2430', cross: 'rgba(232, 238, 246, 0.85)', label: '#283240',
            bg: '#0a0d12' };
const ZONE = { BULLISH: 'rgba(43, 182, 138, 0.11)', BEARISH: 'rgba(240, 85, 95, 0.10)' };
const SWING_ZONE = { BULLISH: 'rgba(43, 182, 138, 0.13)', BEARISH: 'rgba(240, 85, 95, 0.12)' };
const WORD = { BULLISH: 'LONG', BEARISH: 'SHORT', NEUTRAL: 'NO TRADE' };
const RULES = [['5m waves', '5m'], ['9m waves', '9m'], ['11m waves', '11m'], ['5m EMA21 vs EMA47', '5m 21/47']];  // the RDX WIP gate's conditions
const TFS = [1, 2, 3, 5];
const KINDS = [['Stocks', 'stocks'], ['Crypto', 'crypto']], FIRST = { stocks: 'xyz:NVDA', crypto: 'BTC' };  // the two lists, and who opens each
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], WEEKDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const $ = id => document.getElementById(id);
const two = n => String(n).padStart(2, '0');
const sec = ms => Math.floor(ms / 1000);
const ok = v => v !== null && v !== undefined && isFinite(v);
const num = (v, d = 2) => ok(v) ? v.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';
const hhmm = ms => { const d = new Date(ms); return `${two(d.getHours())}:${two(d.getMinutes())}`; };
const when = ms => new Date(ms).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const dayKey = ms => new Date(ms).toISOString().slice(0, 10);          // UTC day (how candles are fetched and archived)
const dayStart = key => Date.parse(key + 'T00:00:00Z');
const kind = st => st === 'BULLISH' ? 'bull' : st === 'BEARISH' ? 'bear' : '';
const bucketStart = (t, m) => { const d0 = t - (t % DAY), s = m * MIN; return d0 + Math.floor((t - d0) / s) * s; };
const bucketEnd = (t, m) => Math.min(bucketStart(t, m) + m * MIN, t - (t % DAY) + DAY);
const pref = (k, fallback) => { try { const v = localStorage.getItem('nsb.perps.' + k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } };
const save = (k, v) => { try { localStorage.setItem('nsb.perps.' + k, JSON.stringify(v)); } catch (e) {} };

// ---- the Indian calendar day (owner 31/10/2026: the strip's days run 00:00 to 24:00 India time) --------------------
// Day "YYYY-MM-DD" begins at 18:30 UTC the day before; it takes its candles from that UTC day's evening and its own UTC day.
const iso = n => new Date(n * DAY).toISOString().slice(0, 10), no = k => Math.round(Date.parse(k + 'T00:00:00Z') / DAY);
const Ist = { dayNo: t => Math.floor((t + IST) / DAY), key: t => iso(Math.floor((t + IST) / DAY)), open: k => no(k) * DAY - IST,
              next: k => iso(no(k) + 1), prev: k => iso(no(k) - 1) };
class IstDayLines extends DayLines {  // the day lines at midnight India time, dated by the Indian date
  updateAllViews() {
    const bars = this.bars(), ts = this.chart().timeScale(), out = [];
    const x0 = bars.length > 1 ? ts.logicalToCoordinate(0) : null, x1 = bars.length > 1 ? ts.logicalToCoordinate(1) : null, r = ts.getVisibleLogicalRange();
    if (x0 !== null && x1 !== null && r) {
      const step = x1 - x0, lo = Math.min(bars.length - 1, Math.max(0, Math.floor(r.from) - 1)), hi = Math.min(bars.length - 1, Math.ceil(r.to) + 1);
      let prev = Ist.dayNo(bars[lo].time);
      for (let i = lo + 1; i <= hi; i++) {
        const k = Ist.dayNo(bars[i].time);
        if (k === prev) continue;
        prev = k;
        const d = new Date(k * DAY);
        out.push([x0 + (i - 0.5) * step, `${WEEKDAY[d.getUTCDay()]} ${d.getUTCDate()} ${MON[d.getUTCMonth()]}`]);
      }
    }
    this.lines = out;
  }
}

// ---- the Swing pane (owner 31/10/2026: shown only) -------------------------------------------------------------
// The Trend pane's waves on the 1-hour, 4-hour and daily candles, in the Trend pane's colours (1h like the 5m, 4h like
// the 9m, 1D like the 11m). Its line switches are kept with the other panes' ones.
const SWING = [['s1a', 60, '1h 8/47', 'w5a'], ['s1b', 60, '1h 21/47', 'w5b'], ['s4a', 240, '4h 8/47', 'w9a'], ['s4b', 240, '4h 21/47', 'w9b'],
               ['sDa', 1440, '1D 8/47', 'w11a'], ['sDb', 1440, '1D 21/47', 'w11b']];
const SWING_TF = [[60, '1h'], [240, '4h'], [1440, '1d']];
{
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('nsb.macd.show')) || {}; } catch (e) {}
  for (const [k, tf, label, like] of SWING) {
    const fast = label.endsWith('8/47');
    LINE[k] = { tf, label, v: fast ? b => b.ema8 - b.ema47 : b => b.ema21 - b.ema47, pair: LINE[like].pair,
                tip: `${label.split(' ')[0]} EMA ${fast ? 8 : 21} − EMA 47 (left color above 0, right color below): shown only, the gate doesn't use it` };
    if (typeof NsbMacd.show[k] !== 'boolean') NsbMacd.show[k] = typeof saved[k] === 'boolean' ? saved[k] : true;
  }
  PANES.swing = { title: 'Swing', lines: SWING.map(s => s[0]) };
}
function swingState(pt) {  // green where every Swing line switched on is above 0, red where every one is below
  const on = PANES.swing.lines.filter(m => NsbMacd.show[m]);
  if (!pt || !on.length) return null;
  let up = 0, down = 0;
  for (const m of on) { const v = pt.v[m]; if (!ok(v)) return null; if (v > 0) up += 1; else if (v < 0) down += 1; }
  return up === on.length ? 'BULLISH' : down === on.length ? 'BEARISH' : null;
}
// A stock's 1h, 4h and daily candles with their EMA 8, 21 and 47 (the engine's EMA), closed candles only. Asked again
// once a new hour has begun (a 1h candle has closed since).
const swingCache = new Map();
async function loadSwing(coin) {
  const now = Date.now(), have = swingCache.get(coin);
  if (have && Math.floor(have.at / HOUR) === Math.floor(now / HOUR)) return have;
  try {
    const bars = {};
    await Promise.all(SWING_TF.map(async ([m, iv]) => {
      const rows = (await candleRows(coin, iv, m === 60 ? now - 4990 * HOUR : 0, now)).map(toBar).sort((a, b) => a.t - b.t);
      const e8 = new Ema(8), e21 = new Ema(21), e47 = new Ema(47), out = [];
      for (const r of rows) {
        if (r.t + m * MIN > now) break;  // still forming
        const b = { time: r.t, open: r.o, high: r.h, low: r.l, close: r.c }, x = [e8.update(r.c), e21.update(r.c), e47.update(r.c)];
        // the waves from the 47th candle on, as the gate waits for 47 bars (a stock listed lately has no daily wave yet)
        if (out.length >= 46) Object.assign(b, { ema8: x[0], ema21: x[1], ema47: x[2] });
        out.push(b);
      }
      bars[m] = out;
    }));
    const s = { at: now, bars };
    swingCache.set(coin, s);
    return s;
  } catch (e) { return have || { at: 0, bars: {} }; }  // not reachable: the last one (tried again next build)
}

// ---- settings (remembered in this browser) ----------------------------------------------------------------
const opt = {
  tf: TFS.includes(pref('tf', 1)) ? pref('tf', 1) : 1,
};

// ---- data: one UTC day of 1-minute candles per market ----------------------------------------------------------
// From our daily archive (data/perps/1m/YYYY-MM-DD/<coin>.json, written by the VPS) when it has the day, else straight
// from Hyperliquid, which keeps about the last 3.5 days of 1-minute candles.
let MEMBERS = {}, LISTS = {}, ALL = [], KIND = 'stocks', COIN = null, archiveDays = new Set(), hlFrom = Infinity;
const dayCache = new Map();  // UTC day -> { coin: { bars, source, complete } }
const tk = c => MEMBERS[c] ? MEMBERS[c].ticker : c.replace(/^xyz:/, '');
const fileOf = c => c.replace(/^xyz:/, '');  // the archive's name for it: Hyperliquid's own
async function archiveIndex() {
  try {
    const r = await fetch('data/perps/1m/index.json', { cache: 'no-cache' });
    if (!r.ok) return new Set();
    const j = await r.json();
    return new Set((j.dates || []).map(String));
  } catch (e) { return new Set(); }
}
const hlEarliest = () => Date.now() - 4990 * MIN;  // a minute Hyperliquid surely still serves at 1m (it keeps the last 5000)
const filesOf = keys => [...new Set(keys.flatMap(k => [Ist.prev(k), k]))].sort();  // the UTC days the Indian days take candles from
const ended = key => Date.now() >= dayStart(key) + DAY + MIN;  // UTC day over, with a minute's grace
async function hlDay(c, d0, end) {
  return (await candleRows(c, '1m', d0, end)).map(toBar).filter(b => b.t >= d0 && b.t <= end).sort((a, b) => a.t - b.t);
}
async function topUp(keys, coin) {  // the cached, unfinished UTC days among keys: only the minutes since the last candle
  await Promise.all(keys.map(k => [k, dayCache.get(k) && dayCache.get(k)[coin]]).filter(([, e]) => e && !e.complete).map(async ([k, e]) => {
    const f0 = dayStart(k), now = Date.now(), done = ended(k), a = e.bars, from = a.length ? a[a.length - 1].t : f0;
    const rows = (await candleRows(coin, '1m', from, Math.min(now, f0 + DAY - 1))).map(toBar).filter(b => b.t >= f0 && b.t < f0 + DAY);
    for (const b of rows) { if (a.length && a[a.length - 1].t === b.t) a[a.length - 1] = b; else if (!a.length || b.t > a[a.length - 1].t) a.push(b); }
    if (done) e.complete = true;
  }));
}
async function loadDay(key, coin) {  // -> { bars (toBar objects), source, complete } of one stock on one UTC day
  let d = dayCache.get(key);
  if (d && d[coin]) { if (!d[coin].complete && ended(key)) await topUp([key], coin); return d[coin]; }
  if (dayStart(key) > Date.now()) return { bars: [], source: 'hl', complete: false };  // not begun yet (not cached: it will)
  const d0 = dayStart(key), done = ended(key);
  let bars = null, source = 'hl';
  if (archiveDays.has(key) && key !== dayKey(Date.now())) {
    try {
      const r = await fetch(`data/perps/1m/${key}/${fileOf(coin)}.json`, { cache: 'no-cache' });
      if (r.ok) { bars = (await r.json()).map(([t, o, h, l, cl, v, n]) => toBar({ t, o, h, l, c: cl, v, n })); source = 'archive'; }
    } catch (e) { /* falls back to Hyperliquid below */ }
  }
  if (!bars && d0 + DAY > hlFrom) bars = (await hlDay(coin, d0, Math.min(d0 + DAY - 1, Date.now()))).filter(b => b.t < d0 + DAY);
  const e = { bars: bars || [], source, complete: done };
  if (!dayCache.has(key)) dayCache.set(key, {});
  dayCache.get(key)[coin] = e;
  return e;
}

// ---- one series, minute by minute, exactly as the live engine runs it (as on the Nasdaq tab) -----------------------
function runSeries(coef, minutes) {
  const sig = new TrendSignal(coef, SHOWN), coins = Object.keys(coef), checksAt = new Map();
  let captured = null;
  const evaluate = sig.evaluate.bind(sig), finish = sig.finishMinute.bind(sig);
  sig.evaluate = (v, now) => { const ev = evaluate(v, now); captured = ev; return ev; };
  sig.finishMinute = (start, close, vol) => { captured = null; finish(start, close, vol); if (captured) checksAt.set(start, captured.checks); };
  const at = Object.fromEntries(coins.map(c => [c, 0]));
  const first = Math.min(...coins.map(c => minutes[c] && minutes[c].length ? minutes[c][0].t : Infinity));
  const last = Math.max(...coins.map(c => minutes[c] && minutes[c].length ? minutes[c][minutes[c].length - 1].t : -Infinity));
  for (let t = first; t <= last; t += MIN) for (const c of coins) {
    const a = minutes[c] || [];
    while (at[c] < a.length && a[at[c]].t < t) at[c]++;
    if (at[c] < a.length && a[at[c]].t === t) sig.onMemberBar(c, t, a[at[c]].c, a[at[c]].v);
  }
  return { sig, stateAt: new Map(sig.history), checksAt, trace: sig.trace, bars: Object.fromEntries(Object.entries(sig.tfs).map(([m, tf]) => [m, tf.bars])) };
}

// ---- building a day ----------------------------------------------------------------------------------------
let day = null;
function minutesOf(days) {  // the stock's bars over the loaded days, one per minute (no gaps after its first)
  const a = contiguous(days.flatMap(d => d.bars).sort((x, y) => x.t - y.t));

  if (refreshing || olderBusy || opening || !day) return;
  const today = Ist.key(Date.now()), was = day.key, coin = COIN;
  if (was !== today || !dayList.includes(today)) return;
  refreshing = true;
  try {
    if (!await buildDay(today, day.shown, true) || day.key !== was || COIN !== coin) return;
    keepView(() => render(false));
  } catch (e) { /* the minute refresh tries again */ } finally { refreshing = false; }
}
async function openDay(key) {  // the calendar, the market list, today's follow: a failed load says why for a moment, the day shown stays
  opening++;
  const run = buildDay(key), seq = builds;
  try {
    if (!await run) return;
    dayPick.set(dayList, key, Ist.key(Date.now()));
    render(true);
    return true;
  } catch (e) {
    if (!day) throw e;
    if (seq !== builds) return;
    const msg = `Couldn't load ${key} (${e.message})`;
    loading(msg);
    setTimeout(() => { if ($('loading-text').textContent === msg) loading(null); }, 3000);
    return false;
  } finally { opening--; }
}
let loadingNow = false, loadingTimer = 0;
const loading = text => {
  clearTimeout(loadingTimer);
  if (text === null) { loadingNow = false; $('loading').hidden = true; return; }
  loadingNow = true; $('loading-text').textContent = text;
  if ($('loading').hidden) loadingTimer = setTimeout(() => { if (loadingNow) $('loading').hidden = false; }, 400);
};

// ---- start ---------------------------------------------------------------------------------------------------
NsbMacd.onToggle(() => { for (const p of Object.values(panels)) { for (const pane of Object.values(p.macd)) pane.showLines(); p.zones.update(); } refreshText(); });
(async () => {
  try {
    loading('Loading the list of days…');
    const j = await (await fetch('perps.json', { cache: 'no-cache' })).json();
    MEMBERS = { ...j.members, ...j.crypto };
    LISTS = { stocks: Object.keys(j.members), crypto: Object.keys(j.crypto || {}) };
    KIND = pref('kind', 'stocks') === 'crypto' && LISTS.crypto.length ? 'crypto' : 'stocks';
    ALL = LISTS[KIND];
    COIN = picked(KIND);
    [archiveDays, hlFrom] = [await archiveIndex(), hlEarliest()];
    dayList = listDays();
    buildControls();
    NsbDraw.setup({ key: 'nsb.draw.perps.' + fileOf(COIN), when });
    panels.stock = new Panel('stock');
    await openDay(dayList[0]);  // today, updating every minute
    liveConnect(); everyMinute();
  } catch (e) {
    loading(`Couldn't load the Perps data (${e.message}). Reload the page to try again.`);
  }
})();
</script>
